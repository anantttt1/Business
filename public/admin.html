<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — AP Creative Studio</title>
  <link rel="stylesheet" href="/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <section id="login-view" class="login-card">
      <h1>Admin login</h1>
      <p class="muted">Orders and notes require authentication.</p>
      <form id="login-form">
        <label>Password <input type="password" id="password" required autocomplete="current-password" /></label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>
    <section id="dashboard-view" hidden>
      <header class="dash-header">
        <div>
          <h1>Orders</h1>
          <p class="muted">Internal dashboard — do not share this URL publicly without auth.</p>
        </div>
        <button id="logout-btn" type="button">Log out</button>
      </header>
      <div id="orders-list" class="orders"></div>
      <p id="dash-message" class="muted"></p>
    </section>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
