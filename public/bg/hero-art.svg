    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#111827" flood-opacity=".16"/></filter>
    <radialGradient id="g1"><stop offset="0" stop-color="#BFDBFE" stop-opacity=".9"/><stop offset="1" stop-color="#BFDBFE" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#93C5FD" stop-opacity=".65"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#DBEAFE" stop-opacity=".95"/><stop offset="1" stop-color="#DBEAFE" stop-opacity="0"/></radialGradient>
