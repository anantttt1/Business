  <circle cx="520" cy="470" r="5" fill="#3B82F6" opacity=".45"/><circle cx="560" cy="500" r="3" fill="#111827" opacity=".3"/><circle cx="330" cy="500" r="4" fill="#3B82F6" opacity=".35"/>
