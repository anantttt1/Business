<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a10">
<title>Your Name — Developer Portfolio</title>
<link rel="stylesheet" href="/portfolio-builder/templates/modern-dark-3d/template.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><span id="brandMark">YN</span> <span id="brandLabel">Portfolio</span></div>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>
<main>
  <section class="hero">
    <div class="wrap">
      <h1 id="heroName">Your Name</h1>
      <p class="role" id="heroRole">Your Role</p>
      <p class="intro" id="heroIntro">Write a short introduction here.</p>
      <div class="meta">
        <span id="metaLocation">Location</span>
        <span id="metaFocus">Focus</span>
        <span id="metaStatus">Status</span>
      </div>
      <p class="hero-actions">
        <a class="btn hidden" id="btnResume" href="#" rel="noopener noreferrer" target="_blank">Resume</a>
        <a class="btn btn-ghost" href="#contact">Contact</a>
      </p>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <h2>About <span class="grad">me</span></h2>
      <p id="aboutP1"></p>
    </div>
  </section>

  <section id="skills">
    <div class="wrap">
      <h2>Skills</h2>
      <div class="grid" id="skillsGrid"></div>
    </div>
  </section>

  <section id="experience">
    <div class="wrap">
      <h2>Experience</h2>
      <div class="timeline" id="expList"></div>
    </div>
  </section>

  <section id="education">
    <div class="wrap">
      <h2>Education</h2>
      <div class="timeline" id="eduList"></div>
    </div>
  </section>

  <section id="projects">
    <div class="wrap">
      <h2>Projects</h2>
      <div class="grid" id="projectsGrid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2>Contact</h2>
      <p id="contactIntro">Have something in mind?</p>
      <p><a id="contactEmail" href="#"></a></p>
      <p id="contactLocation"></p>
      <p id="socialLinks"></p>
    </div>
  </section>
</main>
<footer>
  <div class="wrap">© <span id="yearNow"></span> <span id="footerName">Your Name</span>. Built with AP Creative Studio Portfolio Builder.</div>
</footer>
<script src="/portfolio-builder/templates/modern-dark-3d/template.js"></script>
</body>
</html>
