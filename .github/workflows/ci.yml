name: CI

# Builds the site on every push and pull request, so a broken change is flagged
# immediately (and by e-mail) instead of only showing up as a failed Vercel deploy.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Repo guard-rails
        run: node scripts/check-repo.mjs
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build (same command Vercel runs)
        run: npm run build
      - name: Build output exists
        run: test -s dist/index.html
      - name: Type check (advisory)
        continue-on-error: true
        run: npx tsc -p tsconfig.app.json --noEmit

  # One-time bootstrap: if package-lock.json is missing, generate it and commit it,
  # so builds use exactly the same dependency versions every time.
  lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package-lock.json ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.check.outputs.needed == 'true'
        run: npm install --package-lock-only --ignore-scripts
      - if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json (generated by CI)"
          git pull --rebase origin main
          git push origin HEAD:main
